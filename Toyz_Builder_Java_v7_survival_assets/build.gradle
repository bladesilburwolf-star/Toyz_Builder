// Toyz Builder Engine — Java / Jaylib port (Beta 1 base)
// Compiles on JDK 17+. Native raylib pulled via Jaylib for desktop.
// Future: Android OpenJDK path can reuse this package structure.

plugins {
    id 'java'
    id 'application'
}

group = 'toyz.builder'
version = '1.0.0-beta1-java'

repositories {
    mavenCentral()
}

dependencies {
    // Pin exact version — floating 6.0.+ caused API drift issues during the failed build
    implementation 'uk.co.electronstudio.jaylib:jaylib:6.0.1-0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'toyz.builder.ToyzBuilder'
}

run {
    workingDir = project.projectDir
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
